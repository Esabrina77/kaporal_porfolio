name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    name: Build & Lint (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Build Next.js Project
        run: npm run build

  docker:
    name: Build Docker Image
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Set to true when you want to push to a registry (e.g., Docker Hub or GHCR)
          tags: kaporal-portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Update code and restart Docker
        run: |
          cd /home/sabrina/app/portfolio
          git pull
          sudo docker compose up -d --build
